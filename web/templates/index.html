<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎓 学生助手 v1.1 — 滴答清单深度定制</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <!-- 侧边栏 -->
    <aside class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <h1>🎓 学生助手</h1>
            <span class="version">v1.1</span>
        </div>
        
        <nav class="sidebar-nav">
            <a href="#" class="nav-item active" data-page="today">
                <span class="nav-icon">📅</span> 今日概览
            </a>
            <a href="#" class="nav-item" data-page="tasks">
                <span class="nav-icon">📝</span> 任务管理
            </a>
            <a href="#" class="nav-item" data-page="calendar">
                <span class="nav-icon">📆</span> 日历视图
            </a>
            <a href="#" class="nav-item" data-page="kanban">
                <span class="nav-icon">📋</span> 看板视图
            </a>
            <a href="#" class="nav-item" data-page="eisenhower">
                <span class="nav-icon">🔲</span> 四象限
            </a>
            <a href="#" class="nav-item" data-page="habits">
                <span class="nav-icon">✅</span> 习惯打卡
            </a>
            <a href="#" class="nav-item" data-page="pomodoro">
                <span class="nav-icon">🍅</span> 番茄专注
            </a>
            <a href="#" class="nav-item" data-page="countdowns">
                <span class="nav-icon">🎯</span> 倒数日
            </a>
            <a href="#" class="nav-item" data-page="schedule">
                <span class="nav-icon">🏫</span> 课表
            </a>
            <a href="#" class="nav-item" data-page="dashboard">
                <span class="nav-icon">📊</span> 数据仪表盘
            </a>
        </nav>

        <div class="sidebar-footer">
            <div class="semester-info" id="semesterInfo">
                <span>📚</span> <span id="currentSemester">默认学期</span>
            </div>
        </div>
    </aside>

    <!-- 主内容区 -->
    <main class="main-content" id="mainContent">
        <!-- 页面内容由 JS 动态渲染 -->
    </main>

    <!-- 添加任务弹窗 -->
    <div class="modal" id="taskModal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="modalTitle">📝 添加任务</h2>
                <button class="modal-close" onclick="closeModal('taskModal')">&times;</button>
            </div>
            <div class="modal-body">
                <input type="hidden" id="taskEditId">
                <div class="form-group">
                    <label>任务标题</label>
                    <input type="text" id="taskTitle" placeholder="输入任务标题..." autofocus>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>清单</label>
                        <select id="taskList"></select>
                    </div>
                    <div class="form-group">
                        <label>优先级</label>
                        <select id="taskPriority">
                            <option value="2">🟡 中</option>
                            <option value="1">🔴 高</option>
                            <option value="3">🟢 低</option>
                            <option value="0">⚪ 无</option>
                        </select>
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>截止日期</label>
                        <input type="date" id="taskDueDate">
                    </div>
                    <div class="form-group">
                        <label>四象限</label>
                        <select id="taskEisenhower">
                            <option value="">不设置</option>
                            <option value="important-urgent">🔥 重要且紧急</option>
                            <option value="important-not-urgent">⭐ 重要不紧急</option>
                            <option value="not-important-urgent">⏰ 不重要紧急</option>
                            <option value="not-important-not-urgent">💤 不重要不紧急</option>
                        </select>
                    </div>
                </div>
                <div class="form-group">
                    <label>标签 (逗号分隔)</label>
                    <input type="text" id="taskTags" placeholder="例如: 数学,作业">
                </div>
                <div class="form-group">
                    <label>备注</label>
                    <textarea id="taskNote" rows="2" placeholder="备注..."></textarea>
                </div>
                <div class="form-group">
                    <label>子任务</label>
                    <div id="subtaskList"></div>
                    <button class="btn btn-sm" onclick="addSubtaskField()">+ 添加子任务</button>
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" onclick="closeModal('taskModal')">取消</button>
                <button class="btn btn-primary" onclick="saveTask()">保存</button>
            </div>
        </div>
    </div>

    <!-- Toast -->
    <div class="toast-container" id="toastContainer"></div>

    <script src="/static/js/app.js"></script>
</body>
</html>
